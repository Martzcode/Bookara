<div class="titlebar">
  <div class="titlebar-drag-region" data-tauri-drag-region="deep">
    <img src="/assets/angular.svg" class="titlebar-icon" alt="icon" />
    <span class="titlebar-app-name">Bookara</span>
    <app-menubar></app-menubar>
  </div>
  <div class="titlebar-buttons">
    <button class="titlebar-button" (click)="minimize()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <rect x="2" y="5.5" width="8" height="1" fill="currentColor"/>
      </svg>
    </button>
    <button class="titlebar-button" (click)="toggleMaximize()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <rect x="2.5" y="2.5" width="7" height="7" stroke="currentColor" stroke-width="1" fill="none"/>
      </svg>
    </button>
    <button class="titlebar-button titlebar-button-close" (click)="close()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M3 3L9 9M9 3L3 9" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </div>
</div>
